name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build (arm64 release)
        run: swift build -c release --arch arm64
      - name: Resource bundle regression check
        run: Tests/BundleCheck/run.sh
      - name: Package app bundle
        run: ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Vaani.app
          path: Vaani.app
